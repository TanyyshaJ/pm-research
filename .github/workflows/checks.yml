name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r apps/backend/requirements.lock.txt
      - run: PYTHONPATH=apps/backend python -m pytest apps/backend/tests -q
      - run: npm run typecheck
      - run: npm run build
